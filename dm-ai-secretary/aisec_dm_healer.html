<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>AI 秘書 DM：身心靈工作者</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 身心靈工作者版 DM，1080×1350，無價格、無場次；配色 B 薰衣草晨光 */
:root{
  --aisec-bg:#F3EFF8; --aisec-ink:#4A3F5C; --aisec-ink2:#6B5E80; --aisec-peach:#F2A07B;
  --aisec-peach-soft:#FBE3D6; --aisec-white:#FFFFFF; --aisec-line:#E2D9EE; --aisec-muted:#857A96;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#999;font-family:"Noto Sans TC","WenQuanYi Zen Hei",sans-serif;color:var(--aisec-ink)}
.aisec-dm{width:1080px;height:1350px;margin:0 auto;position:relative;overflow:hidden;padding:64px 72px 0;
  background:radial-gradient(700px 520px at 100% 0%,var(--aisec-peach-soft),transparent 65%),
             radial-gradient(640px 520px at 0% 100%,#E6DCF3,transparent 65%),var(--aisec-bg)}
.aisec-chip{display:inline-flex;gap:10px;align-items:center;font-size:24px;font-weight:700;color:var(--aisec-ink2);border:2px solid var(--aisec-ink2);border-radius:40px;padding:8px 22px}
.aisec-chip i{width:10px;height:10px;border-radius:50%;background:var(--aisec-peach);display:block}
.aisec-title{margin-top:30px;font-weight:900;line-height:1.15}
.aisec-title .l1{display:block;font-size:56px;color:var(--aisec-ink2);letter-spacing:2px}
.aisec-title .l2{display:block;font-size:92px;margin-top:8px}
.aisec-title em{font-style:normal;background:linear-gradient(transparent 58%,var(--aisec-peach) 58%);padding:0 6px}
.aisec-sub{font-size:32px;font-weight:500;margin-top:20px;color:var(--aisec-ink2)}
.aisec-pain{margin-top:40px;background:var(--aisec-white);border-radius:28px;padding:30px 36px;box-shadow:0 8px 0 var(--aisec-line)}
.aisec-pain h3{font-size:28px;color:var(--aisec-peach);margin-bottom:10px}
.aisec-pain p{font-size:28px;line-height:1.75}
.aisec-pain p span{color:var(--aisec-peach);font-weight:900;margin-right:14px}
.aisec-h{font-size:34px;font-weight:900;margin:44px 0 18px;display:flex;align-items:center;gap:14px}
.aisec-h:before{content:"";width:10px;height:34px;border-radius:5px;background:var(--aisec-peach)}
.aisec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.aisec-card{background:var(--aisec-white);border-radius:24px;padding:26px 24px;box-shadow:0 8px 0 var(--aisec-line)}
.aisec-card .n{width:48px;height:48px;border-radius:50%;background:var(--aisec-ink);color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.aisec-card h4{font-size:30px;font-weight:900;margin:16px 0 8px}
.aisec-card p{font-size:23px;line-height:1.55;color:var(--aisec-muted)}
.aisec-foot{position:absolute;left:0;right:0;bottom:0;height:200px;background:var(--aisec-ink);color:#fff;padding:0 72px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.aisec-foot b{font-size:40px;font-weight:900}
.aisec-foot b span{color:var(--aisec-peach)}
.aisec-foot p{font-size:24px;color:#D9D0E6}
</style>
</head>
<body>
<div class="aisec-dm" id="aisec_dm_healer">
  <div class="aisec-chip"><i></i>專為身心靈工作者設計｜實體小班工作坊</div>
  <h1 class="aisec-title"><span class="l1">LINE AI 秘書</span><span class="l2"><em>拿掉焦慮</em>的最佳助手</span></h1>
  <p class="aisec-sub">把瑣事交給秘書，把心力留給個案。</p>

  <div class="aisec-pain">
    <h3>你是不是也這樣？</h3>
    <p><span>✗</span>預約散在 LINE 裡，怕記錯時間、重複約</p>
    <p><span>✗</span>個案上次說了什麼，見面前要一直翻對話</p>
    <p><span>✗</span>結束療程後，還要回訊息、記帳到深夜</p>
  </div>

  <div class="aisec-h">秘書幫你做 3 件事</div>
  <div class="aisec-cards">
    <div class="aisec-card"><div class="n">1</div><h4>預約自動排</h4><p>轉傳預約訊息<br>自動排進行事曆</p></div>
    <div class="aisec-card"><div class="n">2</div><h4>見面前提醒</h4><p>時間到提醒你<br>附上上次的重點</p></div>
    <div class="aisec-card"><div class="n">3</div><h4>收支一句話</h4><p>講一句話<br>每日收支就記好</p></div>
  </div>

  <div class="aisec-foot">
    <b>不用寫程式，<span>當天帶走你的 AI 秘書</span></b>
    <p>場次陸續開放，歡迎私訊詢問｜個案隱私內容請勿轉傳給秘書</p>
  </div>
</div>
</body>
</html>
