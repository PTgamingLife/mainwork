<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F28C28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大叔複盤 · IG 拍攝規劃</title>
<style>
  :root {
    --igp-orange: #F28C28;
    --igp-orange-soft: #FDE3C8;
    --igp-navy: #1F3A5F;
    --igp-navy-soft: #DCE4EE;
    --igp-cream: #FFF8EC;
    --igp-paper: #FFFFFF;
    --igp-ink: #1C2633;
    --igp-muted: #6B7380;
    --igp-line: #1F3A5F;
    --igp-green: #3E8E5E;
    --igp-red: #D64545;
    --igp-shadow: 3px 3px 0 var(--igp-navy);
    --igp-radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--igp-cream); color: var(--igp-ink); }
  body { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif; min-height: 100vh; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .igp-hidden { display: none !important; }

  /* ── Header ── */
  .igp-app { max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }
  .igp-header { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; }
  .igp-logo { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: var(--igp-orange); border: 2px solid var(--igp-navy); box-shadow: var(--igp-shadow); display: grid; place-items: center; font-weight: 900; color: var(--igp-paper); font-size: 1.1rem; }
  .igp-header h1 { font-size: 1.25rem; font-weight: 900; color: var(--igp-navy); line-height: 1.2; }
  .igp-header p { font-size: .85rem; color: var(--igp-muted); margin-top: 2px; }
  .igp-header .igp-user { margin-left: auto; text-align: right; font-size: .75rem; color: var(--igp-muted); }
  .igp-link { background: none; border: none; color: var(--igp-navy); text-decoration: underline; font-size: .75rem; }

  /* ── Buttons / tags (沿用 IG 內容工廠的 tag 概念) ── */
  .igp-btn { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: 10px; padding: 8px 14px; font-weight: 700; color: var(--igp-navy); box-shadow: 2px 2px 0 var(--igp-navy); transition: transform .08s; }
  .igp-btn:active { transform: translate(2px, 2px); box-shadow: none; }
  .igp-btn.igp-primary { background: var(--igp-orange); color: var(--igp-paper); }
  .igp-btn.igp-small { padding: 4px 10px; font-size: .8rem; }
  .igp-tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 20px; border: 1.5px solid currentColor; }
  .igp-t-story { color: var(--igp-orange); }
  .igp-t-tool { color: var(--igp-navy); }
  .igp-t-life { color: var(--igp-green); }

  /* ── Stats ── */
  .igp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .igp-stat { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: var(--igp-radius); padding: 10px 12px; box-shadow: var(--igp-shadow); }
  .igp-stat b { display: block; font-size: 1.4rem; color: var(--igp-orange); line-height: 1.1; }
  .igp-stat span { font-size: .75rem; color: var(--igp-muted); }

  /* ── Toolbar ── */
  .igp-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .igp-toolbar h2 { font-size: 1.15rem; color: var(--igp-navy); font-weight: 900; min-width: 112px; text-align: center; }
  .igp-toolbar .igp-spacer { flex: 1; }
  .igp-seg { display: inline-flex; border: 2px solid var(--igp-navy); border-radius: 10px; overflow: hidden; }
  .igp-seg button { border: none; background: var(--igp-paper); padding: 6px 12px; font-weight: 700; color: var(--igp-navy); font-size: .85rem; }
  .igp-seg button.igp-on { background: var(--igp-navy); color: var(--igp-paper); }

  /* ── Calendar ── */
  .igp-cal { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: var(--igp-radius); box-shadow: var(--igp-shadow); overflow: hidden; }
  .igp-week, .igp-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .igp-week div { text-align: center; font-size: .75rem; font-weight: 700; padding: 6px 0; background: var(--igp-navy); color: var(--igp-paper); }
  .igp-cell { min-height: 108px; border-right: 1px solid var(--igp-navy-soft); border-bottom: 1px solid var(--igp-navy-soft); padding: 6px; text-align: left; background: var(--igp-paper); border-top: none; border-left: none; display: flex; flex-direction: column; gap: 3px; position: relative; overflow: hidden; }
  .igp-cell:nth-child(7n) { border-right: none; }
  .igp-cell.igp-out { background: #FAF6EE; color: #B8BCC3; }
  .igp-cell:hover { background: var(--igp-orange-soft); }
  .igp-cell.igp-today { box-shadow: inset 0 0 0 3px var(--igp-orange); }
  .igp-cell .igp-dnum { font-size: .8rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .igp-cell .igp-day { font-size: .62rem; font-weight: 900; color: var(--igp-paper); background: var(--igp-orange); border-radius: 6px; padding: 0 5px; }
  .igp-cell .igp-ctitle { font-size: .78rem; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: var(--igp-ink); }
  .igp-cell .igp-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; }
  .igp-cell .igp-add { color: #C9CDD3; font-size: 1.2rem; margin: auto; opacity: 0; }
  .igp-cell:hover .igp-add { opacity: 1; }
  .igp-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--igp-navy); flex-shrink: 0; }
  .igp-s-idea { background: #FFFFFF; }
  .igp-s-script { background: #F5C842; }
  .igp-s-shot { background: #5B9BD5; }
  .igp-s-edited { background: #9B6BD1; }
  .igp-s-posted { background: var(--igp-green); }
  .igp-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: var(--igp-muted); margin-top: 10px; align-items: center; }
  .igp-legend span { display: inline-flex; gap: 4px; align-items: center; }

  /* ── List view (沿用 IG 內容工廠 topic-card) ── */
  .igp-list { display: flex; flex-direction: column; gap: 10px; }
  .igp-card { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: var(--igp-radius); padding: 12px 14px; box-shadow: var(--igp-shadow); text-align: left; display: flex; gap: 12px; align-items: flex-start; }
  .igp-card .igp-date { min-width: 52px; text-align: center; border-right: 2px dashed var(--igp-navy-soft); padding-right: 10px; }
  .igp-card .igp-date b { display: block; font-size: 1.3rem; color: var(--igp-navy); }
  .igp-card .igp-date small { font-size: .7rem; color: var(--igp-orange); font-weight: 900; }
  .igp-card h3 { font-size: .95rem; margin: 4px 0; }
  .igp-card p { font-size: .82rem; color: var(--igp-muted); line-height: 1.5; }
  .igp-empty { text-align: center; padding: 40px 16px; color: var(--igp-muted); }

  /* ── Detail sheet ── */
  .igp-sheet-bg { position: fixed; inset: 0; background: rgba(31,58,95,.45); z-index: 20; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 12px; }
  .igp-sheet { width: 100%; max-width: 760px; background: var(--igp-cream); border: 2px solid var(--igp-navy); border-radius: 16px; box-shadow: 6px 6px 0 var(--igp-navy); }
  .igp-sheet-head { position: sticky; top: 0; z-index: 2; background: var(--igp-orange); color: var(--igp-paper); padding: 10px 14px; border-radius: 14px 14px 0 0; border-bottom: 2px solid var(--igp-navy); display: flex; align-items: center; gap: 8px; }
  .igp-sheet-head b { font-size: 1rem; }
  .igp-sheet-head .igp-save { margin-left: auto; font-size: .75rem; opacity: .95; }
  .igp-sheet-head button { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: 8px; width: 34px; height: 34px; font-weight: 900; color: var(--igp-navy); }
  .igp-sheet-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .igp-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .igp-field label, .igp-label { display: block; font-size: .72rem; font-weight: 900; color: var(--igp-navy); letter-spacing: .5px; margin-bottom: 4px; }
  .igp-sheet input[type=text], .igp-sheet textarea, .igp-sheet select { width: 100%; background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: 10px; padding: 8px 10px; font-size: .92rem; line-height: 1.6; }
  .igp-sheet textarea { resize: vertical; min-height: 80px; }
  .igp-sheet textarea.igp-tall { min-height: 260px; }
  .igp-sheet input:focus, .igp-sheet textarea:focus, .igp-sheet select:focus { outline: 3px solid var(--igp-orange-soft); border-color: var(--igp-orange); }
  .igp-title-input { font-size: 1.15rem !important; font-weight: 900; }
  .igp-box { background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: var(--igp-radius); padding: 12px; }
  .igp-box-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .igp-box-head .igp-label { margin: 0; font-size: .85rem; }
  .igp-box-head .igp-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .igp-hook textarea { border-left: 6px solid var(--igp-orange) !important; font-weight: 700; min-height: 56px; }
  .igp-hint { font-size: .75rem; color: var(--igp-muted); margin-top: 4px; }
  .igp-meter { font-size: .78rem; font-weight: 700; color: var(--igp-green); }
  .igp-meter.igp-over { color: var(--igp-red); }
  .igp-steps { list-style: none; counter-reset: igp-step; display: flex; flex-direction: column; gap: 8px; }
  .igp-steps li { counter-increment: igp-step; display: grid; grid-template-columns: 26px 1fr 30px; gap: 8px; align-items: start; }
  .igp-steps li::before { content: counter(igp-step); width: 24px; height: 24px; border-radius: 50%; background: var(--igp-orange); color: var(--igp-paper); font-weight: 900; font-size: .75rem; display: grid; place-items: center; margin-top: 6px; border: 2px solid var(--igp-navy); }
  .igp-steps input { font-weight: 700; font-size: .8rem !important; padding: 4px 8px !important; margin-bottom: 4px; }
  .igp-steps textarea { min-height: 52px !important; }
  .igp-x { background: none; border: none; color: var(--igp-muted); font-size: 1.1rem; padding: 4px; }
  .igp-x:hover { color: var(--igp-red); }
  .igp-checks { display: flex; flex-direction: column; gap: 6px; }
  .igp-check { display: grid; grid-template-columns: 24px 1fr 30px; gap: 6px; align-items: center; }
  .igp-check input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--igp-orange); }
  .igp-check.igp-done input[type=text] { text-decoration: line-through; color: var(--igp-muted); }
  .igp-progress { font-size: .75rem; color: var(--igp-muted); }
  .igp-danger { color: var(--igp-red) !important; border-color: var(--igp-red) !important; box-shadow: 2px 2px 0 var(--igp-red) !important; }
  .igp-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }

  /* ── Teleprompter ── */
  .igp-prompter { position: fixed; inset: 0; z-index: 40; background: #111; color: #FFF; display: flex; flex-direction: column; }
  .igp-prompter-text { flex: 1; min-height: 0; overflow-y: auto; padding: 30vh 24px 50vh; font-size: clamp(1.6rem, 6vw, 2.6rem); line-height: 1.6; white-space: pre-wrap; font-weight: 700; }
  .igp-prompter-bar { display: flex; gap: 8px; padding: 10px; background: #222; align-items: center; flex-wrap: wrap; }
  .igp-prompter-bar label { font-size: .8rem; display: flex; gap: 6px; align-items: center; }

  /* ── Login ── */
  .igp-login { max-width: 420px; margin: 8vh auto 0; background: var(--igp-paper); border: 2px solid var(--igp-navy); border-radius: 16px; box-shadow: 6px 6px 0 var(--igp-navy); padding: 24px; }
  .igp-login h2 { color: var(--igp-navy); margin-bottom: 6px; }
  .igp-login p { font-size: .85rem; color: var(--igp-muted); margin-bottom: 14px; line-height: 1.6; }
  .igp-login input { width: 100%; border: 2px solid var(--igp-navy); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 1rem; }
  .igp-login .igp-btn { width: 100%; }
  .igp-msg { font-size: .82rem; margin-top: 10px; min-height: 1.2em; }
  .igp-msg.igp-err { color: var(--igp-red); }

  .igp-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--igp-navy); color: var(--igp-paper); padding: 8px 16px; border-radius: 20px; font-size: .85rem; z-index: 60; }

  @media (max-width: 640px) {
    .igp-app { padding: 12px 10px 60px; }
    .igp-header h1 { font-size: 1.05rem; }
    .igp-stats { gap: 6px; }
    .igp-stat { padding: 8px; }
    .igp-stat b { font-size: 1.15rem; }
    .igp-cell { min-height: 72px; padding: 3px; }
    .igp-cell .igp-ctitle { font-size: .62rem; -webkit-line-clamp: 3; }
    .igp-cell .igp-day { font-size: .55rem; padding: 0 3px; }
    .igp-cell .igp-dnum { font-size: .7rem; }
    .igp-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .igp-sheet-bg { padding: 0; }
    .igp-sheet { border-radius: 0; border: none; min-height: 100vh; box-shadow: none; }
    .igp-sheet-head { border-radius: 0; }
  }
</style>
</head>
<body>
<div class="igp-app">
  <header class="igp-header">
    <div class="igp-logo">40</div>
    <div>
      <h1>40 歲大叔複盤人生</h1>
      <p>用專注找到人生有趣的事情 · IG 日更拍攝規劃</p>
    </div>
    <div class="igp-user igp-hidden" id="igp-user">
      <div id="igp-user-email"></div>
      <button class="igp-link" id="igp-logout">登出</button>
    </div>
  </header>

  <!-- 登入 -->
  <section class="igp-login igp-hidden" id="igp-login">
    <h2>登入</h2>
    <p>輸入 Email,收信後點信中的連結,或輸入信裡的 6 位數驗證碼。手機與電腦登入同一個 Email,內容就會同步。</p>
    <form id="igp-email-form">
      <input type="email" id="igp-email" placeholder="you@example.com" autocomplete="email" required>
      <button class="igp-btn igp-primary" type="submit">寄送登入信</button>
    </form>
    <form id="igp-code-form" class="igp-hidden" style="margin-top:14px">
      <input type="text" id="igp-code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位數驗證碼" maxlength="10">
      <button class="igp-btn" type="submit">用驗證碼登入</button>
    </form>
    <div class="igp-msg" id="igp-login-msg"></div>
  </section>

  <!-- 主畫面 -->
  <main id="igp-main" class="igp-hidden">
    <div class="igp-stats">
      <div class="igp-stat"><b id="igp-st-day">–</b><span>今天是 Day</span></div>
      <div class="igp-stat"><b id="igp-st-posted">0</b><span>本月已發佈</span></div>
      <div class="igp-stat"><b id="igp-st-ready">0</b><span>腳本待拍</span></div>
    </div>

    <div class="igp-toolbar">
      <button class="igp-btn igp-small" id="igp-prev" aria-label="上個月">◀</button>
      <h2 id="igp-month"></h2>
      <button class="igp-btn igp-small" id="igp-next" aria-label="下個月">▶</button>
      <button class="igp-btn igp-small" id="igp-today">今天</button>
      <span class="igp-spacer"></span>
      <div class="igp-seg">
        <button id="igp-v-cal" class="igp-on">月曆</button>
        <button id="igp-v-list">清單</button>
      </div>
    </div>

    <div id="igp-view"></div>

    <div class="igp-legend" id="igp-legend"></div>
  </main>
</div>

<div id="igp-sheet-root"></div>

<script src="igp-seed.js"></script>
<script src="igp-api.js"></script>
<script src="igp-detail.js"></script>
<script src="igp-app.js"></script>
</body>
</html>
