<!doctype html>
<meta charset="utf-8">
<title>飛吻動畫底稿 — 安麗蛋白素挑戰</title>
<!--
  臨時任務卡的動畫底稿(1000x1000,卡片 hero 用 1:1)。
  左邊小人偶飛吻 → 愛心沿弧線飛過去 → 右邊小人偶接到、心跳一下。

  時間軸由 CSS animation 驅動,總長 4s 無限循環。
  要逐格截圖時把 ?t=<秒數> 帶進來,腳本會用 animation-delay 把時間定格。
  改字改色改這個檔就好,不用重畫。
-->
<style>
  /* 色系 A 經典紐崔萊綠 */
  :root{
    --green:#00703C; --leaf:#7AB800; --cream:#F7F5EE;
    --gold:#C8A24A; --ink:#1F3D2A; --heart:#E8546B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 這支是拿去錄影片的,字型以「渲染這台機器上有的」為準,不是使用者手機的字型。
     WenQuanYi Zen Hei 是這裡唯一的正黑;不要用 font-weight:800,這顆字型沒有粗體字面,
     瀏覽器會合成假粗體,中文筆畫會糊在一起。要粗就靠字級與字距。 */
  body{width:1000px;height:1000px;overflow:hidden;
       font-family:"WenQuanYi Zen Hei","Noto Sans CJK TC","PingFang TC",sans-serif}

  .stage{position:relative;width:1000px;height:1000px;
         background:radial-gradient(circle at 50% 40%, #0a8a4c 0%, var(--green) 55%, #00522c 100%);
         overflow:hidden}

  /* 背景飄動的淡色光暈,讓畫面不死板 */
  .glow{position:absolute;border-radius:50%;background:rgba(122,184,0,.18);filter:blur(40px)}
  .glow.a{width:420px;height:420px;left:-80px;top:120px;animation:drift 6s ease-in-out infinite}
  .glow.b{width:340px;height:340px;right:-60px;bottom:100px;animation:drift 7s ease-in-out infinite reverse}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}

  /* ---- 小人偶:白色線條,純 CSS ---- */
  .figure{position:absolute;bottom:250px;width:200px;height:380px}
  .figure.left{left:130px}
  .figure.right{right:130px}

  .head{position:absolute;left:50%;top:0;width:104px;height:104px;margin-left:-52px;
        border:10px solid #fff;border-radius:50%;background:transparent}
  .body-line{position:absolute;left:50%;top:104px;width:10px;height:150px;margin-left:-5px;
             background:#fff;border-radius:5px}
  .leg{position:absolute;top:250px;width:10px;height:120px;background:#fff;
       border-radius:5px;transform-origin:top center}
  .leg.l{left:50%;margin-left:-5px;transform:rotate(18deg)}
  .leg.r{left:50%;margin-left:-5px;transform:rotate(-18deg)}
  .arm{position:absolute;top:130px;width:10px;height:110px;background:#fff;
       border-radius:5px;transform-origin:top center}
  .arm.l{left:50%;margin-left:-5px}
  .arm.r{left:50%;margin-left:-5px}

  /* 左邊那位:手舉到嘴邊 → 往外揮出(飛吻) */
  .left .arm.r{animation:kissArm 4s ease-in-out infinite}
  @keyframes kissArm{
    0%{transform:rotate(-150deg)}      /* 手在嘴邊 */
    18%{transform:rotate(-150deg)}
    30%{transform:rotate(-58deg)}      /* 揮出去 */
    46%{transform:rotate(-75deg)}
    100%{transform:rotate(-150deg)}
  }
  .left .arm.l{transform:rotate(22deg)}
  /* 飛吻瞬間身體微微前傾 */
  .left{animation:lean 4s ease-in-out infinite;transform-origin:bottom center}
  @keyframes lean{0%,18%{transform:rotate(0)}30%{transform:rotate(5deg)}50%,100%{transform:rotate(0)}}

  /* 右邊那位:接到愛心時雙手張開、輕輕跳一下 */
  .right .arm.l{transform:rotate(30deg);animation:catchL 4s ease-in-out infinite}
  .right .arm.r{transform:rotate(-30deg);animation:catchR 4s ease-in-out infinite}
  @keyframes catchL{0%,60%{transform:rotate(30deg)}70%{transform:rotate(-14deg)}88%,100%{transform:rotate(30deg)}}
  @keyframes catchR{0%,60%{transform:rotate(-30deg)}70%{transform:rotate(14deg)}88%,100%{transform:rotate(-30deg)}}
  .right{animation:hop 4s ease-in-out infinite;transform-origin:bottom center}
  @keyframes hop{0%,64%{transform:translateY(0)}72%{transform:translateY(-26px)}80%,100%{transform:translateY(0)}}

  /* ---- 愛心:沿弧線飛過去 ---- */
  /* 水平位移放外層、垂直弧度放內層,兩層相乘就是拋物線 —— 比 offset-path 好調 */
  .heart-fly{position:absolute;left:215px;bottom:520px;animation:flyX 4s ease-in-out infinite}
  .heart-arc{animation:flyY 4s ease-in-out infinite}
  @keyframes flyX{
    0%,24%{transform:translateX(0);opacity:0}
    26%{opacity:1}
    66%{transform:translateX(500px);opacity:1}
    72%{transform:translateX(500px);opacity:0}
    100%{transform:translateX(500px);opacity:0}
  }
  @keyframes flyY{
    0%,24%{transform:translateY(0) scale(.4)}
    45%{transform:translateY(-110px) scale(1)}
    66%{transform:translateY(20px) scale(1)}
    72%,100%{transform:translateY(20px) scale(1.25)}
  }

  .heart{width:110px;height:110px;position:relative;
         filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
  .heart::before,.heart::after{content:"";position:absolute;top:0;width:55px;height:88px;
    background:var(--heart);border-radius:55px 55px 0 0}
  .heart::before{left:55px;transform:rotate(-45deg);transform-origin:0 100%}
  .heart::after{left:0;transform:rotate(45deg);transform-origin:100% 100%}

  /* 接到的瞬間在右邊那位胸口炸開一圈 */
  .burst{position:absolute;right:165px;bottom:495px;width:120px;height:120px;
         border:6px solid rgba(255,255,255,.9);border-radius:50%;opacity:0;
         animation:burst 4s ease-out infinite}
  @keyframes burst{0%,66%{transform:scale(.2);opacity:0}
                   70%{opacity:.9}
                   84%,100%{transform:scale(2.2);opacity:0}}

  /* ---- 文字 ---- */
  .caption{position:absolute;left:0;right:0;bottom:96px;text-align:center;color:#fff}
  .caption b{display:block;font-size:62px;font-weight:400;letter-spacing:10px;
             text-indent:10px;text-shadow:0 4px 16px rgba(0,0,0,.35)}
  .caption span{display:block;margin-top:22px;font-size:30px;letter-spacing:5px;
                text-indent:5px;color:#D6F0C8}
  .badge{position:absolute;top:70px;left:0;right:0;text-align:center}
  .badge i{display:inline-block;font-style:normal;font-size:30px;font-weight:400;
           letter-spacing:4px;text-indent:4px;
           color:var(--ink);background:var(--gold);padding:14px 34px;border-radius:999px}
</style>

<div class="stage">
  <div class="glow a"></div><div class="glow b"></div>

  <div class="badge"><i>限時任務 · 完成 +3 分</i></div>

  <div class="figure left">
    <div class="head"></div><div class="body-line"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="leg l"></div><div class="leg r"></div>
  </div>

  <div class="heart-fly"><div class="heart-arc"><div class="heart"></div></div></div>
  <div class="burst"></div>

  <div class="figure right">
    <div class="head"></div><div class="body-line"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="leg l"></div><div class="leg r"></div>
  </div>

  <div class="caption">
    <b>你希望誰變健康?</b>
    <span>把這份心意送出去</span>
  </div>
</div>
