<!doctype html>
<meta charset="utf-8">
<title>爬梯子卡片底圖 — 安麗蛋白素挑戰</title>
<!-- LINE 卡片的 hero 靜態圖(1000x1000)。畫「還沒走」的梯子,引人點進去。 -->
<style>
  :root{ --green:#00703C; --gold:#C8A24A; --cream:#F7F5EE; --ink:#1F3D2A; --pink:#E8546B; }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 這台機器只有 WenQuanYi Zen Hei,沒有粗體字面;用 font-weight 會合成假粗體把中文糊掉 */
  body{width:1000px;height:1000px;overflow:hidden;
       font-family:"WenQuanYi Zen Hei","Noto Sans CJK TC","PingFang TC",sans-serif}
  .stage{position:relative;width:1000px;height:1000px;
         background:radial-gradient(circle at 50% 36%, #0a8a4c 0%, var(--green) 58%, #00522c 100%);
         display:flex;flex-direction:column;align-items:center;padding:56px 40px 40px;gap:18px}
  .badge{font-size:28px;letter-spacing:4px;text-indent:4px;color:var(--ink);
         background:var(--gold);padding:12px 32px;border-radius:999px}
  .title{font-size:56px;letter-spacing:6px;text-indent:6px;color:#fff;
         text-shadow:0 4px 16px rgba(0,0,0,.35)}
  .sub{font-size:30px;letter-spacing:4px;text-indent:4px;color:#D6F0C8}
  svg{margin-top:6px}
  .lbl{font-size:26px;fill:var(--cream)}
</style>
<div class="stage">
  <div class="badge">每日一次 · 純娛樂</div>
  <div class="title">玩過這個,代表你⋯⋯</div>
  <div class="sub">你的命定優質蛋白素口味</div>

  <svg width="900" height="560" viewBox="0 0 900 560">
    <!-- 五條直線 -->
    <g stroke="#C8A24A" stroke-width="7" stroke-linecap="round">
      <line x1="90"  y1="90" x2="90"  y2="470"/>
      <line x1="270" y1="90" x2="270" y2="470"/>
      <line x1="450" y1="90" x2="450" y2="470"/>
      <line x1="630" y1="90" x2="630" y2="470"/>
      <line x1="810" y1="90" x2="810" y2="470"/>
      <!-- 橫桿 -->
      <line x1="90"  y1="150" x2="270" y2="150"/>
      <line x1="450" y1="150" x2="630" y2="150"/>
      <line x1="270" y1="215" x2="450" y2="215"/>
      <line x1="630" y1="215" x2="810" y2="215"/>
      <line x1="90"  y1="285" x2="270" y2="285"/>
      <line x1="450" y1="285" x2="630" y2="285"/>
      <line x1="270" y1="350" x2="450" y2="350"/>
      <line x1="630" y1="350" x2="810" y2="350"/>
      <line x1="90"  y1="415" x2="270" y2="415"/>
    </g>
    <!-- 起點 -->
    <g>
      <circle cx="90"  cy="52" r="27" fill="#00703C" stroke="#fff" stroke-width="4"/>
      <circle cx="270" cy="52" r="27" fill="#00703C" stroke="#fff" stroke-width="4"/>
      <circle cx="450" cy="52" r="27" fill="#00703C" stroke="#fff" stroke-width="4"/>
      <circle cx="630" cy="52" r="27" fill="#00703C" stroke="#fff" stroke-width="4"/>
      <circle cx="810" cy="52" r="27" fill="#00703C" stroke="#fff" stroke-width="4"/>
      <g fill="#fff" font-size="28" text-anchor="middle">
        <text x="90" y="62">1</text><text x="270" y="62">2</text><text x="450" y="62">3</text>
        <text x="630" y="62">4</text><text x="810" y="62">5</text>
      </g>
    </g>
    <!-- 終點 -->
    <g class="lbl" text-anchor="middle">
      <text x="90"  y="516">原味</text>
      <text x="270" y="516">草莓口味</text>
      <text x="450" y="516">巧克力口味</text>
      <text x="630" y="516">關鍵行動力</text>
      <text x="810" y="516">抹茶口味</text>
    </g>
  </svg>
</div>
