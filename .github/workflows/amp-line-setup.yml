name: 安麗蛋白素挑戰 — LINE 上線設定(圖文選單 / webhook)

# 手動觸發:Actions → 這個 workflow → Run workflow。
# 預設 dry_run,只印出要送什麼;要真的動到 LINE 必須把 dry_run 選成 false。
on:
  workflow_dispatch:
    inputs:
      action:
        description: 要設定什麼
        required: true
        default: both
        type: choice
        options: [both, richmenu, webhook]
      dry_run:
        description: 只看不送(建議先跑一次 true)
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: amp-line-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests python-dotenv   # amp_richmenu 會 import dotenv

      - name: 設定 LINE
        working-directory: ${{ github.workspace }}
        env:
          AMP_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.AMP_LINE_CHANNEL_ACCESS_TOKEN }}
          AMP_LIFF_URL_COMPACT: ${{ secrets.AMP_LIFF_URL_COMPACT }}
          # webhook 網址是公開值,不需要放 secret
          AMP_WEBHOOK_URL: https://hhcubvixldieuwdeqnwc.supabase.co/functions/v1/amp-line
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            python scripts/amp_line_setup.py --action "${{ inputs.action }}" --apply
          else
            python scripts/amp_line_setup.py --action "${{ inputs.action }}"
          fi
